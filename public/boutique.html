<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique — Nexus Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
:root{--primary:#0ea5e9;--primary-dark:#0284c7;--bg:#0a0a1a;--surface:#111827;--border:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--accent:#8b5cf6;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.shop-layout{display:grid;grid-template-columns:270px 1fr;gap:24px;max-width:1400px;margin:0 auto;padding:100px 24px 40px;}
.sidebar{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;height:fit-content;position:sticky;top:90px;}
.sidebar h3{font-family:'Space Grotesk',sans-serif;font-size:.9rem;color:var(--primary);text-transform:uppercase;letter-spacing:.1em;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.filter-group{margin-bottom:22px;}
.filter-group label{display:block;font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.filter-group select,.price-range input{width:100%;background:#0a0a1a;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:.88rem;outline:none;cursor:pointer;}
.cat-list{list-style:none;}
.cat-list li a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--text-muted);text-decoration:none;font-size:.88rem;transition:all .2s;}
.cat-list li a:hover,.cat-list li a.active{background:rgba(14,165,233,.1);color:var(--primary);}
.cat-list li a span{background:var(--border);color:var(--text-muted);padding:1px 7px;border-radius:20px;font-size:.72rem;}
.price-range{display:flex;gap:8px;margin-top:6px;}
.price-range input{width:50%;text-align:center;}
.btn-apply{width:100%;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:4px;}
.btn-apply:hover{background:var(--primary-dark);}
.btn-reset{width:100%;background:transparent;color:var(--text-muted);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:.82rem;cursor:pointer;margin-top:8px;}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:.82rem;color:var(--text-muted);}
.breadcrumb a{color:var(--text-muted);text-decoration:none;}.breadcrumb a:hover{color:var(--primary);}
.shop-search{display:flex;margin-bottom:20px;}
.shop-search input{flex:1;background:var(--surface);border:1px solid var(--border);border-right:none;color:var(--text);border-radius:12px 0 0 12px;padding:11px 14px;font-size:.92rem;outline:none;}
.shop-search button{background:var(--primary);border:none;color:#fff;padding:11px 18px;border-radius:0 12px 12px 0;cursor:pointer;}
.shop-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.shop-title{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;}.shop-title span{color:var(--primary);}
.result-count{color:var(--text-muted);font-size:.85rem;}
.sort-select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.88rem;outline:none;cursor:pointer;}
.view-toggle{display:flex;gap:4px;}
.view-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.view-btn.active,.view-btn:hover{background:rgba(14,165,233,.1);border-color:var(--primary);color:var(--primary);}
.active-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.filter-tag{display:flex;align-items:center;gap:6px;background:rgba(14,165,233,.1);border:1px solid var(--primary);color:var(--primary);border-radius:20px;padding:3px 10px;font-size:.78rem;}
.filter-tag button{background:none;border:none;color:var(--primary);cursor:pointer;font-size:.9rem;}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
.products-grid.list-view{grid-template-columns:1fr;}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .3s;cursor:pointer;position:relative;}
.product-card:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 8px 24px rgba(14,165,233,.15);}
.product-badge{position:absolute;top:10px;left:10px;padding:2px 9px;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;z-index:2;}
.badge-hot{background:#f59e0b;color:#000;}.badge-sale{background:#ef4444;color:#fff;}.badge-new{background:#10b981;color:#fff;}
.product-img{width:100%;height:185px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;background:linear-gradient(135deg,#1e293b,#0f172a);}
.product-wishlist{position:absolute;top:10px;right:10px;background:rgba(10,10,26,.8);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;transition:all .2s;z-index:2;}
.product-wishlist:hover,.product-wishlist.active{border-color:var(--danger);}
.product-info{padding:14px;}
.product-vendor{font-size:.72rem;color:var(--primary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.product-name{font-weight:600;font-size:.92rem;margin-bottom:7px;line-height:1.4;}
.product-rating{display:flex;align-items:center;gap:5px;margin-bottom:9px;}
.stars{color:#f59e0b;font-size:.8rem;}
.product-price-row{display:flex;align-items:center;justify-content:space-between;}
.product-price{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700;color:var(--primary);}
.product-price-old{text-decoration:line-through;color:var(--text-muted);font-size:.8rem;margin-right:4px;}
.btn-cart{background:rgba(14,165,233,.1);border:1px solid var(--primary);color:var(--primary);border-radius:7px;padding:5px 12px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-cart:hover{background:var(--primary);color:#fff;}
.products-grid.list-view .product-card{display:flex;}
.products-grid.list-view .product-img{width:160px;height:140px;flex-shrink:0;}
.pagination{display:flex;justify-content:center;gap:6px;margin-top:36px;}
.page-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:.88rem;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.page-btn:hover,.page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--border) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:14px;height:300px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast{position:fixed;bottom:28px;right:28px;background:var(--surface);border:1px solid var(--primary);color:var(--text);padding:12px 18px;border-radius:10px;font-size:.88rem;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;}
.toast.show{transform:translateY(0);opacity:1;}
.cart-overlay{position:fixed;top:0;right:-420px;width:390px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:1000;transition:right .3s;padding:22px;overflow-y:auto;display:flex;flex-direction:column;}
.cart-overlay.open{right:0;}
.cart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.cart-header h3{font-family:'Space Grotesk',sans-serif;}
.cart-close{background:none;border:none;color:var(--text-muted);font-size:1.4rem;cursor:pointer;}
.cart-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.cart-item-img{width:54px;height:54px;border-radius:8px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.cart-item-info{flex:1;}
.cart-item-name{font-size:.82rem;font-weight:600;margin-bottom:3px;}
.cart-item-price{color:var(--primary);font-weight:700;font-size:.88rem;}
.cart-item-qty{display:flex;align-items:center;gap:7px;margin-top:5px;}
.qty-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);width:22px;height:22px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cart-item-remove{background:none;border:none;color:var(--text-muted);cursor:pointer;margin-left:auto;}
.cart-footer{padding-top:14px;border-top:1px solid var(--border);}
.cart-total{display:flex;justify-content:space-between;margin-bottom:14px;font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;}
.cart-total span:last-child{color:var(--primary);}
.btn-checkout{width:100%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;border-radius:10px;padding:13px;font-size:.95rem;font-weight:700;cursor:pointer;}
.mobile-filter-btn{display:none;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:.88rem;cursor:pointer;align-items:center;gap:6px;}
@media(max-width:900px){.shop-layout{grid-template-columns:1fr;}.sidebar{display:none;position:fixed;top:0;left:-100%;width:270px;height:100vh;overflow-y:auto;z-index:999;transition:left .3s;border-radius:0;}.sidebar.open{display:block;left:0;}.mobile-filter-btn{display:flex;}}
@media(max-width:600px){.shop-layout{padding:80px 12px 36px;}.products-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>

    <div class="shop-search"><input type="text" id="mainSearch" placeholder="Rechercher dans la boutique..."><button onclick="doSearch()">&#128269;</button></div>
    <div class="active-filters" id="activeFilters"></div>
    <div class="shop-header">
      <div><h1 class="shop-title" id="pageTitle">Tous les <span>produits</span></h1><p class="result-count" id="resultCount">Chargement...</p></div>
      <div class="shop-controls">

<script>
var PRODS=[
  {id:"p1",n:"iPhone 15 Pro Max",v:"TechShop Pro",c:"electronique",p:1299,op:1499,r:4.8,rv:2847,b:"hot",e:"📱",s:15420},
  {id:"p2",n:"Samsung QLED 65\"",v:"ElectroPlanet",c:"electronique",p:799,op:1199,r:4.7,rv:1203,b:"sale",e:"📺",s:3201},

  {id:"p5",n:"Canap\u00e9 Design Moderne",v:"MaisonLux",c:"maison",p:899,op:1299,r:4.5,rv:342,b:null,e:"🛋️",s:1234},
  {id:"p6",n:"PS5 + Controller",v:"GameWorld",c:"gaming",p:549,op:null,r:4.9,rv:12034,b:"hot",e:"🎮",s:45231},
  {id:"p7",n:"Parfum Boss Bottled",v:"BeautyParis",c:"beaute",p:89,op:119,r:4.4,rv:2109,b:"sale",e:"🌸",s:9876},
  {id:"p8",n:"V\u00e9lo \u00c9lectrique 500W",v:"SportMoto",c:"sport",p:1199,op:1499,r:4.7,rv:567,b:null,e:"🚴",s:2341},
  {id:"p9",n:"Drone DJI Mini 4 Pro",v:"TechShop Pro",c:"electronique",p:759,op:899,r:4.8,rv:3201,b:"sale",e:"🚁",s:8765},
  {id:"p10",n:"AirPods Pro 2",v:"Apple Reseller",c:"electronique",p:279,op:null,r:4.8,rv:15678,b:"hot",e:"🎧",s:67890},
  {id:"p11",n:"Robe Soir\u00e9e \u00c9l\u00e9gante",v:"FashionNexus",c:"mode",p:159,op:229,r:4.5,rv:876,b:"sale",e:"👗",s:4567},
  {id:"p12",n:"Robot Cuisine 1200W",v:"MaisonLux",c:"maison",p:349,op:499,r:4.6,rv:1432,b:"sale",e:"🍳",s:5678},
  {id:"p13",n:"Montre Connect\u00e9e Ultra",v:"TechShop Pro",c:"electronique",p:399,op:null,r:4.7,rv:2345,b:"new",e:"⌚",s:12345},
  {id:"p14",n:"FIFA 25 PS5",v:"GameWorld",c:"gaming",p:69,op:null,r:4.3,rv:8901,b:"new",e:"⚽",s:34567},
  {id:"p15",n:"Cr\u00e8me Anti-\u00c2ge Luxe",v:"BeautyParis",c:"beaute",p:129,op:179,r:4.6,rv:1234,b:"sale",e:"✨",s:6543},
  {id:"p16",n:"Tente Camping 4P",v:"SportMoto",c:"sport",p:299,op:399,r:4.5,rv:654,b:"sale",e:"⛺",s:3456},
  {id:"p17",n:"Accessoires BMW Pack",v:"AutoPremium",c:"auto",p:249,op:null,r:4.4,rv:432,b:"new",e:"🚗",s:2109},
  {id:"p18",n:"Harry Potter Complet",v:"LibrairieNexus",c:"livres",p:89,op:120,r:4.9,rv:5432,b:"sale",e:"📚",s:23456},
  {id:"p19",n:"RTX 4090 Gaming GPU",v:"TechShop Pro",c:"gaming",p:1599,op:null,r:4.9,rv:987,b:"hot",e:"🖥️",s:4321},
  {id:"p20",n:"Aspirateur Robot Pro",v:"MaisonLux",c:"maison",p:499,op:699,r:4.7,rv:2098,b:"sale",e:"🤖",s:8765},
  {id:"p21",n:"Jordan 4 Retro",v:"SportZone",c:"mode",p:189,op:220,r:4.8,rv:6789,b:"hot",e:"👠",s:34567},
  {id:"p22",n:"Palette Maquillage Pro",v:"BeautyParis",c:"beaute",p:79,op:null,r:4.5,rv:3456,b:"new",e:"💄",s:12987},
  {id:"p23",n:"Enceinte Sonos Era 300",v:"ElectroPlanet",c:"electronique",p:449,op:null,r:4.6,rv:1876,b:null,e:"🔊",s:5432},
  {id:"p24",n:"Tableau D\u00e9co Moderne",v:"MaisonLux",c:"maison",p:199,op:279,r:4.4,rv:543,b:"sale",e:"🖼️",s:2876},
];
var st={all:PRODS.slice(),fil:PRODS.slice(),cat:"all",q:"",page:1,pp:12,view:"g",
  cart:JSON.parse(localStorage.getItem("nx_cart")||"[]"),
  wish:JSON.parse(localStorage.getItem("nx_wish")||"[]")};
function render(){
  var g=document.getElementById("prodGrid");
  var pg=st.fil.slice((st.page-1)*st.pp,st.page*st.pp);
  g.innerHTML="";
  g.className="products-grid"+(st.view==="l"?" list-view":"");
  if(!pg.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted)"><div style="font-size:3rem">&#128542;</div><h3>Aucun produit</h3></div>';return;}
  pg.forEach(function(p){
    var inW=st.wish.indexOf(p.id)>=0;
    var d=document.createElement("div");
    d.className="product-card";
    d.onclick=function(){location.href="produit.html?id="+p.id;};
    var badge="";
    if(p.b==="hot")badge='<div class="product-badge badge-hot">&#128293; Top</div>';
    else if(p.b==="sale")badge='<div class="product-badge badge-sale">PROMO</div>';
    else if(p.b==="new")badge='<div class="product-badge badge-new">NOUVEAU</div>';
    var stars="★★★★★".slice(0,Math.floor(p.r))+"☆☆☆☆☆".slice(0,5-Math.floor(p.r));
    var oldP=p.op?'<span class="product-price-old">'+p.op+'\u20ac</span>':"";
    var wishCls=inW?" active":"";
    var wishHeart=inW?"\u2764\uFE0F":"\uD83E\uDD0D";
    var pid=p.id;
    d.innerHTML=badge+
      '<div class="product-img">'+p.e+'</div>'+
      '<div class="product-wishlist'+wishCls+'" id="w'+pid+'">'+wishHeart+'</div>'+
      '<div class="product-info">'+
        '<div class="product-vendor">'+p.v+'</div>'+
        '<div class="product-name">'+p.n+'</div>'+
        '<div class="product-rating"><span class="stars">'+stars+'</span><span style="font-size:.75rem;color:var(--text-muted)"> '+p.r+' ('+p.rv.toLocaleString()+')</span></div>'+
        '<div class="product-price-row">'+
          '<div>'+oldP+'<span class="product-price">'+p.p.toLocaleString()+' \u20ac</span></div>'+
          '<button class="btn-cart">+ Panier</button>'+
        '</div>'+
      '</div>';
    d.querySelector(".product-wishlist").onclick=function(e){e.stopPropagation();tw(pid);};
    d.querySelector(".btn-cart").onclick=function(e){e.stopPropagation();ac(pid);};
    g.appendChild(d);
  });
  document.getElementById("resultCount").textContent=st.fil.length+" produit"+(st.fil.length>1?"s":"")+" trouv"+(st.fil.length>1?"\u00e9s":"\u00e9");
  renderPgn();
}
function renderPgn(){
  var tot=Math.ceil(st.fil.length/st.pp),p=document.getElementById("pgn");
  p.innerHTML="";if(tot<=1)return;
  var prev=document.createElement("button");prev.className="page-btn";prev.textContent="\u2039";prev.disabled=st.page<=1;
  prev.onclick=function(){st.page--;render();window.scrollTo(0,0);}; p.appendChild(prev);
  for(var i=1;i<=tot;i++){
    var b=document.createElement("button");
    b.className="page-btn"+(i===st.page?" active":"");
    b.textContent=i;
    (function(pg){b.onclick=function(){st.page=pg;render();window.scrollTo(0,0);};})(i);
    p.appendChild(b);
  }
  var next=document.createElement("button");next.className="page-btn";next.textContent="\u203A";next.disabled=st.page>=tot;
  next.onclick=function(){st.page++;render();window.scrollTo(0,0);}; p.appendChild(next);
}
function applyFilters(){
  var f=st.all.slice();
  if(st.cat!=="all")f=f.filter(function(p){return p.c===st.cat;});
  if(st.q)f=f.filter(function(p){return p.n.toLowerCase().indexOf(st.q)>=0||p.v.toLowerCase().indexOf(st.q)>=0;});
  var mn=parseFloat(document.getElementById("priceMin").value);
  var mx=parseFloat(document.getElementById("priceMax").value);
  if(!isNaN(mn)&&mn>0)f=f.filter(function(p){return p.p>=mn;});
  if(!isNaN(mx)&&mx>0)f=f.filter(function(p){return p.p<=mx;});
  var rt=parseInt(document.getElementById("ratingFilter").value);
  if(rt>0)f=f.filter(function(p){return p.r>=rt;});
  var sk=document.getElementById("stockFilter").value;
  if(sk==="promo")f=f.filter(function(p){return p.op;});
  st.fil=f;st.page=1;doSort(false);render();renderTags();
}
function doSort(r){
  var s=document.getElementById("sortSel").value;
  var d=r===false?st.fil.slice():st.fil;
  if(s==="pa")d.sort(function(a,b){return a.p-b.p;});
  else if(s==="pd")d.sort(function(a,b){return b.p-a.p;});
  else if(s==="note")d.sort(function(a,b){return b.r-a.r;});
  else if(s==="sold")d.sort(function(a,b){return b.s-a.s;});
  else if(s==="new")d.sort(function(a,b){return(b.b==="new"?1:0)-(a.b==="new"?1:0);});
  if(r!==false){st.fil=d;render();}
}
function doSearch(){
  var v1=document.getElementById("mainSearch").value;
  var v2=document.getElementById("navSearch").value;
  st.q=(v1||v2).toLowerCase();
  applyFilters();
}
window.doSearch=doSearch;
function filterCat(c,el){
  st.cat=c;
  document.querySelectorAll(".cat-list a").forEach(function(a){a.classList.remove("active");});
  el.classList.add("active");
  var t={all:"Boutique",electronique:"\u00c9lectronique",mode:"Mode",maison:"Maison & D\u00e9co",sport:"Sport",beaute:"Beaut\u00e9",gaming:"Gaming",auto:"Auto",livres:"Livres"};
  document.getElementById("breadCat").textContent=t[c]||c;
  document.getElementById("pageTitle").innerHTML=(t[c]||c).replace(/(\s+)(\S+)$/, "$1<span>$2</span>");
  applyFilters();
}
window.filterCat=filterCat;
function resetFilters(){
  st.cat="all";st.q="";
  document.getElementById("priceMin").value="";
  document.getElementById("priceMax").value="";
  document.getElementById("ratingFilter").value="0";
  document.getElementById("stockFilter").value="all";
  document.getElementById("mainSearch").value="";
  document.querySelectorAll(".cat-list a").forEach(function(a,i){a.classList.toggle("active",i===0);});
  st.fil=st.all.slice();render();renderTags();
}
window.resetFilters=resetFilters;window.applyFilters=applyFilters;window.doSort=doSort;
function setView(v){
  st.view=v;
  document.getElementById("gBtn").classList.toggle("active",v==="g");
  document.getElementById("lBtn").classList.toggle("active",v==="l");
  render();
}
window.setView=setView;
function renderTags(){
  var tags=[],h="";
  if(st.cat!=="all")tags.push({l:"&#128193; "+st.cat,k:"cat"});
  if(st.q)tags.push({l:"&#128269; "+st.q,k:"q"});
  tags.forEach(function(t){h+='<div class="filter-tag">'+t.l+'<button data-k="'+t.k+'" onclick="rmTag(this.dataset.k)">&#10005;</button></div>';});
  document.getElementById("activeFilters").innerHTML=h;
}
function rmTag(k){if(k==="cat"){st.cat="all";document.querySelectorAll(".cat-list a").forEach(function(a,i){a.classList.toggle("active",i===0);});}if(k==="q"){st.q="";document.getElementById("mainSearch").value="";}applyFilters();}
window.rmTag=rmTag;
function saveCart(){localStorage.setItem("nx_cart",JSON.stringify(st.cart));}
function ac(id){
  var p=null;for(var i=0;i<PRODS.length;i++){if(PRODS[i].id===id){p=PRODS[i];break;}}
  if(!p)return;
  var ex=null;for(var j=0;j<st.cart.length;j++){if(st.cart[j].id===id){ex=st.cart[j];break;}}
  if(ex)ex.qty++;else st.cart.push({id:id,n:p.n,p:p.p,e:p.e,qty:1});
  saveCart();updateCartUI();
  showToast("\u2705 "+p.n+" ajout\u00e9 !");
}
function updateCartUI(){
  var tot=0;st.cart.forEach(function(i){tot+=i.qty;});
  document.getElementById("cartCount").textContent=tot;
  var ci=document.getElementById("cartItems");
  if(!st.cart.length){ci.innerHTML='<p style="color:var(--text-muted);text-align:center;padding:40px 0">Panier vide</p>';document.getElementById("cartTotal").textContent="0,00 \u20ac";return;}
  var h="";st.cart.forEach(function(i){
    h+='<div class="cart-item"><div class="cart-item-img">'+i.e+'</div><div class="cart-item-info"><div class="cart-item-name">'+i.n+'</div><div class="cart-item-price">'+i.p.toFixed(2)+' \u20ac</div><div class="cart-item-qty"><button class="qty-btn" onclick="uq(\"'+i.id+'\",-1)">\u2212</button><span>'+i.qty+'</span><button class="qty-btn" onclick="uq(\"'+i.id+'\",1)">+</button><button class="cart-item-remove" onclick="rc(\"'+i.id+'\")">&#128465;</button></div></div></div>';
  });
  ci.innerHTML=h;
  var s=0;st.cart.forEach(function(i){s+=i.p*i.qty;});
  document.getElementById("cartTotal").textContent=s.toFixed(2).replace(".",",")+" \u20ac";
}
function uq(id,d){var i=null;for(var j=0;j<st.cart.length;j++){if(st.cart[j].id===id){i=st.cart[j];break;}}if(!i)return;i.qty+=d;if(i.qty<=0)st.cart=st.cart.filter(function(x){return x.id!==id;});saveCart();updateCartUI();}
function rc(id){st.cart=st.cart.filter(function(x){return x.id!==id;});saveCart();updateCartUI();}
function toggleCart(){document.getElementById("cartSidebar").classList.toggle("open");}
function toggleMenu(){document.getElementById("mobileMenu").classList.toggle("open");}
window.uq=uq;window.rc=rc;window.toggleCart=toggleCart;window.toggleMenu=toggleMenu;
function tw(id){
  var idx=st.wish.indexOf(id);
  if(idx>=0)st.wish.splice(idx,1);else st.wish.push(id);
  localStorage.setItem("nx_wish",JSON.stringify(st.wish));
  render();
}
function showToast(m){
  var t=document.getElementById("toast");
  t.textContent=m;t.classList.add("show");
  setTimeout(function(){t.classList.remove("show");},3000);
}
var up=new URLSearchParams(location.search);
if(up.get("cat")){var a=document.querySelector(".cat-list a[onclick*=\""+up.get("cat")+"\"]");if(a){filterCat(up.get("cat"),a);}}
if(up.get("q")){document.getElementById("mainSearch").value=up.get("q");st.q=up.get("q");}
window.addEventListener("scroll",function(){document.getElementById("navbar").classList.toggle("scrolled",scrollY>20);});
document.getElementById("navSearch").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch();});
document.getElementById("mainSearch").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch();});
updateCartUI();
applyFilters();
</script>
</body>
</html>
