<title>Fiche Produit — Nexus Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
:root{--primary:#0ea5e9;--primary-dark:#0284c7;--bg:#0a0a1a;--surface:#111827;--border:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--accent:#8b5cf6;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.prod-page{max-width:1300px;margin:0 auto;padding:100px 24px 60px;}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:24px;font-size:.82rem;color:var(--text-muted);}
.breadcrumb a{color:var(--text-muted);text-decoration:none;}.breadcrumb a:hover{color:var(--primary);}
.prod-main{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-bottom:60px;}
/* GALLERY */
.gallery{display:flex;flex-direction:column;gap:12px;}
.gallery-main{background:var(--surface);border:1px solid var(--border);border-radius:16px;height:420px;display:flex;align-items:center;justify-content:center;font-size:8rem;position:relative;overflow:hidden;}
.gallery-main::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(14,165,233,.05) 0%,transparent 70%);}
.gallery-thumbs{display:flex;gap:10px;}
.thumb{width:80px;height:80px;background:var(--surface);border:2px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;transition:all .2s;}
.thumb:hover,.thumb.active{border-color:var(--primary);}
/* PRODUCT INFO */
.prod-info{}
.prod-vendor-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.prod-vendor-badge{background:rgba(14,165,233,.1);color:var(--primary);border:1px solid var(--primary);border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:600;}
.prod-verified{background:rgba(16,185,129,.1);color:var(--success);border:1px solid var(--success);border-radius:20px;padding:3px 10px;font-size:.72rem;}
.prod-title{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:12px;line-height:1.3;}
.prod-rating-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.stars-lg{color:var(--warning);font-size:1.1rem;}
.rating-num{font-weight:700;font-size:1rem;}
.rating-cnt{color:var(--text-muted);font-size:.85rem;}
.sold-badge{background:rgba(245,158,11,.1);color:var(--warning);border:1px solid rgba(245,158,11,.3);border-radius:20px;padding:2px 10px;font-size:.75rem;}
.price-block{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;}
.price-main{font-family:'Space Grotesk',sans-serif;font-size:2.2rem;font-weight:800;color:var(--primary);margin-bottom:4px;}
.price-old{font-size:.9rem;color:var(--text-muted);margin-bottom:4px;}
.price-old s{margin-right:8px;}
.discount-badge{display:inline-block;background:var(--danger);color:#fff;border-radius:6px;padding:2px 8px;font-size:.75rem;font-weight:700;}
.price-info{font-size:.78rem;color:var(--text-muted);margin-top:8px;}
.stock-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
.stock-dot{width:10px;height:10px;border-radius:50%;}
.stock-in{background:var(--success);}
.stock-text{font-size:.88rem;color:var(--success);}
/* VARIANTS */
.variants{margin-bottom:20px;}
.variants label{display:block;font-size:.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.variant-list{display:flex;flex-wrap:wrap;gap:8px;}
.variant-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 16px;font-size:.85rem;cursor:pointer;transition:all .2s;}
.variant-btn:hover,.variant-btn.active{border-color:var(--primary);color:var(--primary);background:rgba(14,165,233,.08);}
/* QTY */
.qty-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.qty-row label{font-size:.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}
.qty-ctrl{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.qty-ctrl button{background:var(--surface);border:none;color:var(--text);width:40px;height:40px;cursor:pointer;font-size:1.2rem;transition:background .2s;}
.qty-ctrl button:hover{background:rgba(14,165,233,.1);}
.qty-ctrl span{width:50px;text-align:center;font-weight:600;font-size:1rem;}
/* CTA */
.cta-row{display:flex;gap:12px;margin-bottom:16px;}
.btn-add-cart{flex:1;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;border-radius:12px;padding:15px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-add-cart:hover{opacity:.9;transform:translateY(-1px);}
.btn-buy-now{flex:1;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;border:none;border-radius:12px;padding:15px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-buy-now:hover{opacity:.9;transform:translateY(-1px);}
          '<button class="btn-wish'+(inWish?' active':'')+'" id="wishBtn">'+ 
.btn-wish:hover,.btn-wish.active{border-color:var(--danger);color:var(--danger);background:rgba(239,68,68,.08);}
/* FEATURES */
.prod-features{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
.feat-item{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.82rem;}
.feat-icon{font-size:1.1rem;}
/* SELLER CARD */
.seller-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:20px;}
.seller-card h4{font-size:.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;}
.seller-info{display:flex;align-items:center;gap:12px;}
.seller-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:1.3rem;}
.seller-name{font-weight:600;font-size:.92rem;}
.seller-meta{font-size:.75rem;color:var(--text-muted);}
.seller-rating{display:flex;align-items:center;gap:4px;font-size:.78rem;}
.seller-rating span{color:var(--warning);}
/* TABS */
.tabs{margin-bottom:40px;}
.tab-nav{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;}
.tab-btn{background:none;border:none;color:var(--text-muted);padding:12px 20px;font-size:.92rem;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
/* DESCRIPTION */
.desc-content p{margin-bottom:12px;line-height:1.7;color:var(--text-muted);}
.desc-content ul{list-style:none;margin:16px 0;}
.desc-content ul li{padding:6px 0;padding-left:20px;position:relative;color:var(--text-muted);font-size:.9rem;}
.desc-content ul li::before{content:'✓';position:absolute;left:0;color:var(--success);}
.specs-table{width:100%;border-collapse:collapse;}
.specs-table tr:nth-child(even){background:rgba(255,255,255,.02);}
.specs-table td{padding:10px 14px;border:1px solid var(--border);font-size:.88rem;}
.specs-table td:first-child{color:var(--text-muted);width:35%;}
/* REVIEWS */
.reviews-summary{display:flex;gap:30px;margin-bottom:30px;flex-wrap:wrap;}
.rating-big{text-align:center;}
.rating-big .num{font-family:'Space Grotesk',sans-serif;font-size:4rem;font-weight:800;color:var(--primary);line-height:1;}
.rating-big .stars{font-size:1.2rem;color:var(--warning);}
.rating-big .cnt{font-size:.78rem;color:var(--text-muted);}
.rating-bars{flex:1;}
.rbar{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.rbar-label{font-size:.8rem;color:var(--text-muted);width:50px;}
.rbar-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.rbar-fill{height:100%;background:var(--warning);border-radius:3px;}
.rbar-count{font-size:.75rem;color:var(--text-muted);width:30px;}
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;}
.review-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.reviewer{font-weight:600;font-size:.9rem;}
.review-date{font-size:.75rem;color:var(--text-muted);}
.review-stars{color:var(--warning);}
.review-title{font-weight:600;font-size:.88rem;margin-bottom:6px;}
.review-body{font-size:.85rem;color:var(--text-muted);line-height:1.6;}
.review-helpful{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.78rem;color:var(--text-muted);}
.helpful-btn{background:var(--bg);border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:3px 10px;font-size:.75rem;cursor:pointer;}
.helpful-btn:hover{border-color:var(--primary);color:var(--primary);}
/* RELATED */
.related{margin-top:60px;}
.related h2{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;margin-bottom:24px;}
.related h2 span{color:var(--primary);}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.related-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .3s;}
.related-card:hover{border-color:var(--primary);transform:translateY(-3px);}
.related-img{height:140px;display:flex;align-items:center;justify-content:center;font-size:3rem;background:linear-gradient(135deg,#1e293b,#0f172a);}
.related-info{padding:12px;}
.related-name{font-size:.85rem;font-weight:600;margin-bottom:6px;}
.related-price{color:var(--primary);font-weight:700;font-size:.95rem;}
/* TOAST / CART */
.toast{position:fixed;bottom:28px;right:28px;background:var(--surface);border:1px solid var(--primary);color:var(--text);padding:12px 18px;border-radius:10px;font-size:.88rem;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;}
.toast.show{transform:translateY(0);opacity:1;}
.cart-overlay{position:fixed;top:0;right:-420px;width:390px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:1000;transition:right .3s;padding:22px;overflow-y:auto;display:flex;flex-direction:column;}
.cart-overlay.open{right:0;}
.cart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.cart-header h3{font-family:'Space Grotesk',sans-serif;}
.cart-close{background:none;border:none;color:var(--text-muted);font-size:1.4rem;cursor:pointer;}
.cart-items{flex:1;overflow-y:auto;}
.cart-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.cart-item-img{width:54px;height:54px;border-radius:8px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.cart-item-info{flex:1;}
.cart-item-name{font-size:.82rem;font-weight:600;margin-bottom:3px;}
.cart-item-price{color:var(--primary);font-weight:700;font-size:.88rem;}
.cart-item-qty{display:flex;align-items:center;gap:7px;margin-top:5px;}
.qty-btn2{background:var(--bg);border:1px solid var(--border);color:var(--text);width:22px;height:22px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cart-item-remove{background:none;border:none;color:var(--text-muted);cursor:pointer;margin-left:auto;}
.cart-footer{padding-top:14px;border-top:1px solid var(--border);}
.cart-total-row{display:flex;justify-content:space-between;margin-bottom:14px;font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;}
.cart-total-row span:last-child{color:var(--primary);}
.btn-checkout{width:100%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;border-radius:10px;padding:13px;font-size:.95rem;font-weight:700;cursor:pointer;}
@media(max-width:900px){.prod-main{grid-template-columns:1fr;gap:28px;}.prod-features{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.prod-page{padding:80px 12px 40px;}.prod-title{font-size:1.4rem;}.price-main{font-size:1.8rem;}.cta-row{flex-wrap:wrap;}.gallery-main{height:280px;font-size:5rem;}.related-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>

        '</div>'+
        '<div class="stock-row"><div class="stock-dot stock-in"></div><span class="stock-text">En stock — Expédié sous 24h</span></div>'+
        (p.sizes?'<div class="variants"><label>Taille / Capacité</label><div class="variant-list" id="sizeList">'+
          function(){var sl='';if(p.sizes)p.sizes.forEach(function(s){sl+='<button class="variant-btn'+(s===selSize?' active':'')+'" onclick="selectSize(\"'+s+'\",this)">'+s+'</button>';});return sl;}()+
        '</div></div>':'')+
        '<div class="variants"><label>Couleur</label><div class="variant-list" id="colorList">'+
          function(){var cl='';p.colors.forEach(function(c){cl+='<button class="variant-btn'+(c===selColor?' active':'')+'" onclick="selectColor(\"'+c+'\",this)">'+c+'</button>';});return cl;}()+
        '</div></div>'+
        '<div class="qty-row"><label>Quantité</label>'+
          '<div class="qty-ctrl">'+
            '<button onclick="changeQty(-1)">−</button>'+
            '<span id="qtyVal">1</span>'+
            '<button onclick="changeQty(1)">+</button>'+
          '</div>'+
        '</div>'+
        '<div class="cta-row">'+
          '<button class="btn-add-cart" onclick="addToCart()">🛒 Ajouter au panier</button>'+
          '<button class="btn-buy-now" onclick="buyNow()">⚡ Acheter maintenant</button>'+
          '<button class="btn-wish'+(inWish?' active':'')+'" data-pid=\"'+ p.id +'\"" id="wishBtn" onclick="toggleWish(this.dataset.pid))">'+
            (inWish?'❤️':'🤍')+
          '</button>'+
        '</div>'+
        '<div class="prod-features">'+
          '<div class="feat-item"><span class="feat-icon">🚚</span> Livraison express 24h</div>'+
          '<div class="feat-item"><span class="feat-icon">🔄</span> Retour gratuit 30j</div>'+
          '<div class="feat-item"><span class="feat-icon">🛡️</span> Garantie 2 ans</div>'+
          '<div class="feat-item"><span class="feat-icon">💳</span> Paiement sécurisé</div>'+
          '<div class="feat-item"><span class="feat-icon">📦</span> Emballage soigné</div>'+
          '<div class="feat-item"><span class="feat-icon">🎁</span> Gift wrap disponible</div>'+
        '</div>'+
        '<div class="seller-card">'+
          '<h4>À propos du vendeur</h4>'+
          '<div class="seller-info">'+
            '<div class="seller-avatar">🏪</div>'+
            '<div>'+
              '<div class="seller-name">'+p.v+'</div>'+
              '<div class="seller-rating"><span>★★★★★</span> '+p.vr+' • '+p.vsold.toLocaleString()+' ventes</div>'+
              '<div class="seller-meta">Membre depuis 2023 • Commission Nexus: 10%</div>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="tabs">'+
      '<div class="tab-nav">'+
        '<button class="tab-btn active" onclick="showTab('desc',this)">📝 Description</button>'+
        '<button class="tab-btn" onclick="showTab('specs',this)">⚙️ Caractéristiques</button>'+
        '<button class="tab-btn" onclick="showTab('reviews',this)">⭐ Avis ('+p.rv.toLocaleString()+')</button>'+
        '<button class="tab-btn" onclick="showTab('ship',this)">🚚 Livraison</button>'+
      '</div>'+
      '<div id="tabDesc" class="tab-pane active">'+
        '<div class="desc-content">'+
          '<p>'+p.desc+'</p>'+
          '<ul>'+function(){var fl='';p.feats.forEach(function(f){fl+='<li>'+f+'</li>';});return fl;}()+'</ul>'+
          '<p>Profitez de la meilleure expérience shopping sur Nexus Store. Livraison rapide, retours faciles, et service client disponible 24h/24.</p>'+
        '</div>'+
      '</div>'+
      '<div id="tabSpecs" class="tab-pane">'+
        '<table class="specs-table">'+
          function(){var sl='';Object.keys(p.specs).forEach(function(k){sl+='<tr><td>'+k+'</td><td>'+p.specs[k]+'</td></tr>';});return sl;}()+
          '<tr><td>Commission Nexus</td><td>10% (reversée au vendeur)</td></tr>'+
          '<tr><td>Disponibilité</td><td>En stock</td></tr>'+
        '</table>'+
      '</div>'+
      '<div id="tabReviews" class="tab-pane">'+
        '<div class="reviews-summary">'+
          '<div class="rating-big"><div class="num">'+p.r+'</div><div class="stars">'+'★'.repeat(5)+'</div><div class="cnt">'+p.rv.toLocaleString()+' avis</div></div>'+
          '<div class="rating-bars">'+
            function(){var rb='';[5,4,3,2,1].forEach(function(s){var pct=s===5?68:s===4?20:s===3?7:s===2?3:2;var cnt=Math.round(p.rv*(pct/100));rb+='<div class="rbar"><span class="rbar-label">'+s+' ★</span><div class="rbar-track"><div class="rbar-fill" style="width:'+pct+'%"></div></div><span class="rbar-count">'+cnt+'</span></div>';});return rb;}()+
          '</div>'+
        '</div>'+
        function(){var rv='';REVIEWS.forEach(function(r){var st='★★★★★'.substring(0,r.stars)+'☆☆☆☆☆'.substring(0,5-r.stars);rv+='<div class="review-card"><div class="review-header"><div><div class="reviewer">'+r.name+'</div><div class="review-stars">'+st+'</div></div><div class="review-date">'+r.date+'</div></div><div class="review-title">'+r.title+'</div><div class="review-body">'+r.body+'</div></div>';});return rv;}()+
      '</div>'+
      '<div id="tabShip" class="tab-pane">'+
        '<div class="desc-content">'+
          '<p><strong>📦 Livraison Standard</strong><br>3-5 jours ouvrés — Gratuite dès 25€</p>'+
          '<p><strong>⚡ Livraison Express</strong><br>1-2 jours ouvrés — 4,99€</p>'+
          '<p><strong>🚀 Livraison Nexus Prime</strong><br>Livraison le jour même dans les grandes villes — Gratuite avec Nexus Elite</p>'+
          '<p><strong>🔄 Politique de retour</strong><br>Retours gratuits sous 30 jours. Remboursement sous 48h après réception.</p>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="related">'+
      '<h2>Vous aimerez <span>aussi</span></h2>'+
      '<div class="related-grid">'+
        function(){var rp='';var rel=PRODS.filter(function(pr){return pr.id!==p.id;}).slice(0,4);rel.forEach(function(pr){rp+='<div class="related-card" onclick="location.href=\'produit.html?id='+pr.id+'\'"><div class="related-img">'+pr.e+'</div><div class="related-info"><div class="related-name">'+pr.n+'</div><div class="related-price">'+pr.p.toLocaleString()+' €</div></div></div>';});return rp;}()+
      '</div>'+
    '</div>';
}

window.setImg=function(emoji,el){
  document.getElementById('mainImg').textContent=emoji;
  document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
};
window.showTab=function(id,btn){
  document.querySelectorAll('.tab-pane').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('active');
  btn.classList.add('active');
};
window.changeQty=function(d){
  qty=Math.max(1,Math.min(qty+d,99));
  document.getElementById('qtyVal').textContent=qty;
};
window.selectSize=function(s,el){
  selSize=s;
  document.querySelectorAll('#sizeList .variant-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
};
window.selectColor=function(c,el){
  selColor=c;
  document.querySelectorAll('#colorList .variant-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
};
window.addToCart=function(){
  const p=getProduct();
  const ex=cart.find(x=>x.id===p.id);
  if(ex)ex.qty+=qty; else cart.push({id:p.id,n:p.n,p:p.p,e:p.e,qty});
  localStorage.setItem('nx_cart',JSON.stringify(cart));
  updateCartUI();
  toast('✅ '+p.n+' × '+qty+' ajouté !');
};
window.buyNow=function(){addToCart();location.href='checkout.html';};
window.toggleWish=function(id){
  if(wish.includes(id))var newW=[];for(var wx=0;wx<wish.length;wx++){if(wish[wx]!==id)newW.push(wish[wx]);}wish=newW;; else wish.push(id);
  localStorage.setItem('nx_wish',JSON.stringify(wish));
  const btn=document.getElementById('wishBtn');
  if(btn){btn.classList.toggle('active',wish.includes(id));btn.textContent=wish.includes(id)?'❤️':'🤍';}
};
window.toggleCart=function(){document.getElementById('cartSidebar').classList.toggle('open');};
window.toggleMenu=function(){document.getElementById('mobileMenu').classList.toggle('open');};

function updateCartUI(){
  const tot=cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('cartCount').textContent=tot;
  const ci=document.getElementById('cartItems');
  if(!cart.length){ci.innerHTML='<p style="color:var(--text-muted);text-align:center;padding:40px 0">Panier vide</p>';document.getElementById('cartTotal').textContent='0,00 €';return;}
  var ciH='';cart.forEach(function(i){ciH+='<div class="cart-item"><div class="cart-item-img">'+i.e+'</div><div class="cart-item-info"><div class="cart-item-name">'+i.n+'</div><div class="cart-item-price">'+i.p.toFixed(2)+' €</div><div class="cart-item-qty"><button class="qty-btn2" onclick="uq(\"'+i.id+'\",-1)">−</button><span>'+i.qty+'</span><button class="qty-btn2" onclick="uq(\"'+i.id+'\",1)">+</button><button class="cart-item-remove" onclick="rc(\"'+i.id+'\")">🗑</button></div></div></div>';});ci.innerHTML=ciH;;
  document.getElementById('cartTotal').textContent=cart.reduce((s,i)=>s+i.p*i.qty,0).toFixed(2).replace('.',',')+' €';
}
window.uq=function(id,d){const i=cart.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);localStorage.setItem('nx_cart',JSON.stringify(cart));updateCartUI();};
window.rc=function(id){cart=cart.filter(x=>x.id!==id);localStorage.setItem('nx_cart',JSON.stringify(cart));updateCartUI();};

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

window.addEventListener('scroll',()=>document.getElementById('navbar').classList.toggle('scrolled',scrollY>20));
updateCartUI();
renderPage();
</script>
</body>
</html>
